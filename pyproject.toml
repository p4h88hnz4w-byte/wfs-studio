[project]
name = "wfs-studio"
version = "0.7.1"
description = "Desktop GUI for browsing Wii U title dumps and running wfs-extract."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wfs-studio contributors" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pack = ["pyinstaller>=6"]

[project.scripts]
wfs-studio = "wfs_studio.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
